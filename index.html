table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border-soft)}

/* ============================= AUTH (Firebase Authentication) ============================= */

// ค่าปัจจุบันของผู้ใช้ที่ล็อกอินอยู่จะถูกเซ็ตโดย onAuthStateChanged ด้านล่าง (ใกล้ๆ ท้ายไฟล์)
// ซึ่งจะคง session ไว้ให้อัตโนมัติแม้รีเฟรชหน้า — ไม่ต้องเขียนจัดการ session เอง

function userById(id){ return users.find(u=>u.id===id); }
function fmtBaht(n){ return "฿"+n.toLocaleString(); }
function fmtDate(d){ return d.toLocaleDateString("th-TH",{day:"numeric",month:"short"}) + " · " + d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}); }
function isToday(d){ const n=new Date(); return d.toDateString()===n.toDateString(); }
function isSameDay(d,offset){ return d.toDateString()===daysAgo(offset).toDateString(); }

/* ============================= DERIVED / STATS ============================= */
function todaysBookings(){ return rawBookings.filter(b=>isToday(b.at)); }
function revenueOf(list){ return list.filter(b=>b.status!=="cancelled").reduce((s,b)=>s+b.amount,0); }

function last7DaysRevenue(){
  const out=[];
  for(let i=6;i>=0;i--){
    const list = rawBookings.filter(b=>isSameDay(b.at,i));
    out.push({ offset:i, label: i===0?"วันนี้": daysAgo(i).toLocaleDateString("th-TH",{day:"numeric",month:"short"}), value: revenueOf(list) });
  }
  return out;
}

function categoryBreakdown(){
  const counts={};
  rawBookings.forEach(b=>{ if(b.status==="cancelled") return; counts[b.cat]=(counts[b.cat]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}

function statusBreakdown(){
  const counts={pending:0,in_progress:0,completed:0,cancelled:0};
  rawBookings.forEach(b=>counts[b.status]++);
  return counts;
}

function toneDim(t){ return { brand:"var(--brand-dim)", amber:"var(--amber-dim)", red:"var(--red-dim)", blue:"var(--blue-dim)" }[t] || "rgba(255,255,255,.06)"; }

  { id:"overview", label:"ภาพรวม", icon:"layout-dashboard" },
  { id:"bookings",  label:"การจอง & บริการ", icon:"calendar-check" },
  { id:"partners",  label:"ผู้ให้บริการ", icon:"users-round" },
  { id:"customers", label:"ผู้ใช้บริการ", icon:"user" },
];

function sidebar(){
  return `
  <aside class="w-[236px] shrink-0 h-screen sticky top-0 flex flex-col" style="background:var(--surface);border-right:1px solid var(--border-soft)">
    <div class="px-5 py-5 flex items-center gap-2.5" style="border-bottom:1px solid var(--border-soft)">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:var(--brand-dim)">
        ${icon("shield-half",17,"")}
      </div>
      <div>
        <p class="disp font-semibold" style="font-size:14px;line-height:1.1">ORNSIRIN OPS</p>
        <p style="font-size:10.5px;color:var(--ink-faint)">แผงควบคุมแอดมิน</p>
      </div>
    </div>
    <nav class="flex-1 px-3 py-4 flex flex-col gap-1">
      ${NAV.map(n=>`
        <div class="navlink ${state.section===n.id?"active":""}" data-nav="${n.id}">
          ${icon(n.icon,16)}<span>${n.label}</span>

    <div class="px-4 py-4 mx-3 mb-4 rounded-xl" style="background:var(--surface);border:1px solid var(--border-soft)">

      <div class="flex flex-col gap-1.5" style="font-size:11.5px;color:var(--ink-dim)">
        <div class="flex items-center gap-2">${icon("smartphone",13)} ผู้ใช้บริการ</div>
        <div class="flex items-center gap-2" style="color:var(--brand)">${icon("shield-half",13)} แอดมิน (คุณอยู่ที่นี่)</div>
        <div class="flex items-center gap-2">${icon("briefcase",13)} พาร์ทเนอร์ผู้ให้บริการ</div>
      </div>
    </div>
  </aside>`;

function topbar(){
  const titleMap = { overview:"ภาพรวมระบบ", bookings:"การจอง & บริการทั้งหมด", partners:"ผู้ให้บริการ / พาร์ทเนอร์", customers:"ผู้ใช้บริการ" };
  const now = new Date();
  return `
  <header class="sticky top-0 z-10 flex items-center justify-between px-7 py-4" style="background:rgba(15,21,18,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-soft)">
    <div>
      <h1 class="disp font-semibold" style="font-size:19px">${titleMap[state.section]}</h1>
      <p style="font-size:12px;color:var(--ink-faint)" class="mt-0.5">${now.toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style="background:var(--brand-dim);color:var(--brand);font-size:11.5px;font-weight:600">
        <span class="led led-brand pulse"></span> LIVE
      </div>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full flex items-center justify-center font-semibold disp" style="background:var(--surface-2);border:1px solid var(--border);font-size:12px" title="${state.auth.user ? state.auth.user.name : ""}">${state.auth.user ? state.auth.user.name.slice(0,1) : "อ"}</div>
        <button data-logout class="w-8 h-8 rounded-full flex items-center justify-center" style="background:var(--surface-2);border:1px solid var(--border);color:var(--ink-dim)" title="ออกจากระบบ">${icon("log-out",14)}</button>
      </div>
    </div>
  </header>`;
}

/* ============================= OVERVIEW SECTION ============================= */
function kpiCard(label, value, sub, icn, t){
  return `
  <div class="card p-5 flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <span style="font-size:12px;color:var(--ink-faint)">${label}</span>
      <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:${toneDim(t)};color:${tone(t)}">${icon(icn,14)}</div>
    </div>
    <p class="disp tabnum" style="font-size:26px;font-weight:600">${value}</p>
    <p style="font-size:11.5px;color:var(--ink-dim)">${sub}</p>
  </div>`;
}

function overviewSection(){
  const today = todaysBookings();
  const inProgress = today.filter(b=>b.status==="in_progress").length;
  const revToday = revenueOf(today);
  const totalUsers = users.length;
  const onDuty = partners.filter(p=>p.status!=="off").length;

  const rev7 = last7DaysRevenue();
  const maxRev = Math.max(...rev7.map(d=>d.value), 1);
  const cats = categoryBreakdown();
  const maxCat = Math.max(...cats.map(c=>c[1]), 1);
  const sBreak = statusBreakdown();
  const sTotal = Object.values(sBreak).reduce((a,b)=>a+b,0);

  // conic-gradient donut
  let acc=0;
  const donutStops = Object.entries(sBreak).map(([k,v])=>{
    const pct = v/sTotal*100;
    const start = acc; acc += pct;
    return `${tone(STATUS[k].tone)} ${start}% ${acc}%`;
  }).join(",");

  const liveQueue = rawBookings.filter(b=>b.status==="in_progress");

  return `
  <div class="grid grid-cols-4 gap-4 mb-6">
    ${kpiCard("การจองวันนี้", today.length, `${inProgress} รายการกำลังให้บริการ`, "calendar-check","blue")}
    ${kpiCard("รายได้วันนี้", fmtBaht(revToday), "ไม่รวมรายการที่ยกเลิก","banknote","brand")}
    ${kpiCard("ผู้ให้บริการพร้อมงาน", `${onDuty}/${partners.length}`, "ทุกประเภทบริการ","users-round","amber")}
    ${kpiCard("ผู้ใช้บริการทั้งหมด", totalUsers, `${users.filter(u=>u.resident).length} ลูกบ้าน · ${users.filter(u=>!u.resident).length} ลูกค้าทั่วไป`,"user","blue")}
  </div>

  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="card p-5 col-span-2">
      <div class="flex items-center justify-between mb-4">
        <p class="disp font-semibold" style="font-size:14px">รายได้ 7 วันล่าสุด</p>
        <p style="font-size:11px;color:var(--ink-faint)">หน่วย: บาท</p>
      </div>
      <div class="flex items-end gap-3" style="height:130px">
        ${rev7.map(d=>`
          <div class="flex-1 flex flex-col items-center gap-2 h-full justify-end">
            <span class="tabnum" style="font-size:10.5px;color:var(--ink-dim)">${d.value?d.value.toLocaleString():"0"}</span>
            <div style="width:100%;border-radius:6px 6px 3px 3px;background:${d.offset===0?"var(--brand)":"var(--surface-hover)"};height:${Math.max(6,(d.value/maxRev)*84)}px"></div>
            <span style="font-size:10.5px;color:var(--ink-faint)">${d.label}</span>
          </div>`).join("")}
      </div>
    </div>

    <div class="card p-5 flex flex-col items-center">
      <p class="disp font-semibold self-start mb-4" style="font-size:14px">สถานะการจอง</p>
      <div class="donut" style="background:conic-gradient(${donutStops})"></div>
      <div class="grid grid-cols-2 gap-x-4 gap-y-1.5 mt-4 w-full">
        ${Object.entries(sBreak).map(([k,v])=>`
          <div class="flex items-center gap-1.5" style="font-size:11.5px;color:var(--ink-dim)">
            <span class="led" style="background:${tone(STATUS[k].tone)};box-shadow:none"></span>${STATUS[k].label}
            <span class="tabnum" style="color:var(--ink)">${v}</span>
          </div>`).join("")}
      </div>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-4">
    <div class="card p-5 col-span-2">
      <p class="disp font-semibold mb-4" style="font-size:14px">บริการที่มีการจองมากสุด</p>
      <div class="flex flex-col gap-3">
        ${cats.map(([catKey,count])=>{
          const c = CATS[catKey];
          return `
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style="background:${toneDim(c.tone)};color:${tone(c.tone)}">${icon(c.icon,14)}</div>
            <span style="font-size:12.5px;width:140px" class="shrink-0">${c.label}</span>
            <div class="flex-1 rounded-full h-2" style="background:var(--surface-hover)">
              <div class="h-2 rounded-full" style="width:${(count/maxCat)*100}%;background:${tone(c.tone)}"></div>
            </div>
            <span class="tabnum shrink-0" style="font-size:12.5px;color:var(--ink-dim);width:22px;text-align:right">${count}</span>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="card p-5">
      <div class="flex items-center justify-between mb-4">
        <p class="disp font-semibold" style="font-size:14px">คิวกำลังให้บริการ</p>
        <span class="led led-blue pulse" style="background:var(--blue)"></span>
      </div>
      <div class="flex flex-col gap-3 max-h-[220px] overflow-y-auto scrollbox pr-1">
        ${liveQueue.length ? liveQueue.map(b=>`
          <div class="rowbtn flex items-center gap-3 p-2 rounded-lg" style="background:var(--surface)" data-open-booking="${b.ref}">
            <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style="background:${toneDim(CATS[b.cat].tone)};color:${tone(CATS[b.cat].tone)}">${icon(CATS[b.cat].icon,13)}</div>
            <div class="flex-1 min-w-0">
              <p style="font-size:12.5px" class="truncate">${userById(b.userId).name}</p>
              <p style="font-size:11px;color:var(--ink-faint)" class="truncate">${b.provider} · ${CATS[b.cat].label}</p>
            </div>
          </div>`).join("") : `<p style="font-size:12px;color:var(--ink-faint)" class="py-6 text-center">ไม่มีบริการที่กำลังดำเนินการ</p>`}
      </div>
    </div>
  </div>`;
}

/* ============================= BOOKINGS SECTION ============================= */
function filteredBookings(){
  return rawBookings
    .filter(b=> state.bookingCat==="all" || b.cat===state.bookingCat)
    .filter(b=> state.bookingStatus==="all" || b.status===state.bookingStatus)
    .filter(b=>{
      if(!state.bookingSearch) return true;
      const q = state.bookingSearch.toLowerCase();
      return b.ref.toLowerCase().includes(q) || userById(b.userId).name.toLowerCase().includes(q) || b.provider.toLowerCase().includes(q);
    })
    .sort((a,b)=>b.at-a.at);
}

function bookingsSection(){
  const list = filteredBookings();
  return `
  <div class="card p-5">
    <div class="flex items-center gap-3 mb-4 flex-wrap">
      <input type="text" id="bookingSearchInput" placeholder="ค้นหาเลขที่จอง / ชื่อลูกค้า / ผู้ให้บริการ" value="${state.bookingSearch}" style="width:280px" />
      <select id="bookingCatSelect">
        <option value="all" ${state.bookingCat==="all"?"selected":""}>ทุกประเภทบริการ</option>
        ${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${state.bookingCat===k?"selected":""}>${c.label}</option>`).join("")}
      </select>
      <select id="bookingStatusSelect">
        <option value="all" ${state.bookingStatus==="all"?"selected":""}>ทุกสถานะ</option>
        ${Object.entries(STATUS).map(([k,s])=>`<option value="${k}" ${state.bookingStatus===k?"selected":""}>${s.label}</option>`).join("")}
      </select>
      <span style="font-size:12px;color:var(--ink-faint)" class="ml-auto">${list.length} รายการ</span>
    </div>
    <div class="overflow-x-auto">
      <table>
        <thead><tr>
          <th>เลขที่จอง</th><th>ลูกค้า</th><th>บริการ</th><th>ผู้ให้บริการ</th><th>เวลา</th><th>ยอดเงิน</th><th>สถานะ</th>
        </tr></thead>
        <tbody>
          ${list.map(b=>`
            <tr class="rowbtn" data-open-booking="${b.ref}">
              <td class="tabnum" style="color:var(--ink-dim)">${b.ref}</td>
              <td>${userById(b.userId).name}</td>
              <td>
                <span class="flex items-center gap-1.5">${icon(CATS[b.cat].icon,13,"")}<span style="color:${tone(CATS[b.cat].tone)}">${CATS[b.cat].label}</span></span>
              </td>
              <td style="color:var(--ink-dim)">${b.provider}</td>
              <td class="tabnum" style="color:var(--ink-faint);font-size:12px">${fmtDate(b.at)}</td>
              <td class="tabnum">${b.amount?fmtBaht(b.amount):"—"}${b.discount?` <span style="color:var(--brand);font-size:10.5px">ลูกบ้าน</span>`:""}</td>
              <td>${statusChip(b.status)}</td>
            </tr>`).join("")}
          ${!list.length ? `<tr><td colspan="7" class="text-center" style="color:var(--ink-faint);padding:30px">ไม่พบรายการที่ตรงกับการค้นหา</td></tr>` : ""}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ============================= PARTNERS SECTION ============================= */
function partnersSection(){
  const groups = {};
  partners.forEach(p=>{ (groups[p.type] = groups[p.type]||[]).push(p); });

  return `
  <div class="grid grid-cols-2 gap-4">
    ${Object.entries(groups).map(([type,list])=>`
      <div class="card p-5">
        <div class="flex items-center justify-between mb-3">
          <p class="disp font-semibold" style="font-size:14px">${PARTNER_TYPES[type].label}</p>
          <span style="font-size:11px;color:var(--ink-faint)">${list.filter(p=>p.status==="avail").length} พร้อมงาน จาก ${list.length}</span>
        </div>
        <div class="flex flex-col gap-2">
          ${list.map(p=>`
            <div class="rowbtn flex items-center gap-3 p-2.5 rounded-lg" style="background:var(--surface)" data-open-partner="${p.id}">
              <div class="w-8 h-8 rounded-full flex items-center justify-center disp font-semibold shrink-0" style="background:var(--surface-hover);font-size:12px">${p.name.slice(0,1)}</div>
              <div class="flex-1 min-w-0">
                <p style="font-size:13px" class="truncate">${p.name}</p>
                <p style="font-size:11px;color:var(--ink-faint)" class="truncate">${p.role}</p>
              </div>
              <div class="text-right shrink-0">
                <p style="font-size:11px;color:var(--ink-dim)" class="mb-1">${icon("star",11,"inline mb-0.5")} ${p.rating} · ${p.jobsToday} งานวันนี้</p>
                ${partnerStatusChip(p.status)}
              </div>
            </div>`).join("")}
        </div>
      </div>`).join("")}
  </div>`;
}

/* ============================= CUSTOMERS SECTION ============================= */
function filteredUsers(){
  return users
    .filter(u=> state.userFilter==="all" || (state.userFilter==="resident" ? u.resident : !u.resident))
    .filter(u=>!state.userSearch || u.name.toLowerCase().includes(state.userSearch.toLowerCase()))
    .sort((a,b)=>b.bookings-a.bookings);
}

function customersSection(){
  const list = filteredUsers();
  return `
  <div class="card p-5">
    <div class="flex items-center gap-3 mb-4 flex-wrap">
      <input type="text" id="userSearchInput" placeholder="ค้นหาชื่อผู้ใช้บริการ" value="${state.userSearch}" style="width:260px" />
      <select id="userFilterSelect">
        <option value="all" ${state.userFilter==="all"?"selected":""}>ทั้งหมด</option>
        <option value="resident" ${state.userFilter==="resident"?"selected":""}>ลูกบ้าน Ornsirin</option>
        <option value="guest" ${state.userFilter==="guest"?"selected":""}>ลูกค้าทั่วไป</option>
      </select>
      <span style="font-size:12px;color:var(--ink-faint)" class="ml-auto">${list.length} คน</span>
    </div>
    <div class="overflow-x-auto">
      <table>
        <thead><tr>
          <th>ชื่อ</th><th>ประเภท</th><th>ที่อยู่</th><th>เข้าร่วมเมื่อ</th><th>จำนวนการจอง</th><th>ใช้งานล่าสุด</th>
        </tr></thead>
        <tbody>
          ${list.map(u=>`
            <tr>
              <td>${u.name}</td>
              <td>${u.resident ? `<span class="chip" style="background:var(--brand-dim);color:var(--brand)">${icon("badge-check",11)}ลูกบ้าน</span>` : `<span class="chip" style="background:var(--surface-hover);color:var(--ink-dim)">ลูกค้าทั่วไป</span>`}</td>
              <td style="color:var(--ink-dim)">${u.place}</td>
              <td style="color:var(--ink-faint);font-size:12px">${u.joined}</td>
              <td class="tabnum">${u.bookings}</td>
              <td style="color:var(--ink-faint);font-size:12px">${u.lastActive}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ============================= DRAWER ============================= */
function drawer(){
  if(!state.drawer) return "";
  const closeBtn = `<button data-close-drawer class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:var(--surface-hover)">${icon("x",15)}</button>`;

  if(state.drawer.kind==="booking"){
    const b = rawBookings.find(x=>x.ref===state.drawer.ref);
    if(!b) return "";
    const u = userById(b.userId);
    const c = CATS[b.cat];
    return `
    <div class="fixed inset-0 z-30 flex justify-end" data-drawer-overlay>
      <div class="absolute inset-0" style="background:rgba(0,0,0,.5)" data-close-drawer></div>
      <div class="relative w-[380px] h-full p-6 flex flex-col gap-5 overflow-y-auto" style="background:var(--surface);border-left:1px solid var(--border-soft)">
        <div class="flex items-center justify-between">
          <p class="disp font-semibold" style="font-size:16px">รายละเอียดการจอง</p>
          ${closeBtn}
        </div>
        <div class="card p-4 flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${toneDim(c.tone)};color:${tone(c.tone)}">${icon(c.icon,18)}</div>
          <div><p class="disp font-semibold" style="font-size:14px">${c.label}</p><p class="tabnum" style="font-size:11.5px;color:var(--ink-faint)">${b.ref}</p></div>
          <div class="ml-auto">${statusChip(b.status)}</div>
        </div>
        <div class="flex flex-col gap-3" style="font-size:13px">
          <div class="flex justify-between"><span style="color:var(--ink-faint)">ลูกค้า</span><span>${u.name}</span></div>
          <div class="flex justify-between"><span style="color:var(--ink-faint)">ประเภทลูกค้า</span><span>${u.resident?"ลูกบ้าน Ornsirin":"ลูกค้าทั่วไป"}</span></div>
          <div class="flex justify-between"><span style="color:var(--ink-faint)">ที่อยู่</span><span class="text-right">${u.place}</span></div>
          <div class="flex justify-between"><span style="color:var(--ink-faint)">ผู้ให้บริการ</span><span>${b.provider}</span></div>
          <div class="flex justify-between"><span style="color:var(--ink-faint)">เวลาที่จอง</span><span class="tabnum">${fmtDate(b.at)}</span></div>
          <div class="flex justify-between"><span style="color:var(--ink-faint)">ส่วนลดลูกบ้าน</span><span>${b.discount?"ใช้สิทธิ์ 15%":"ไม่ใช้สิทธิ์"}</span></div>
          <div class="flex justify-between pt-3" style="border-top:1px solid var(--border-soft)"><span style="color:var(--ink-faint)">ยอดชำระ</span><span class="disp font-semibold" style="font-size:15px">${b.amount?fmtBaht(b.amount):"ฟรี (สิทธิ์ลูกบ้าน)"}</span></div>
        </div>
      </div>
    </div>`;
  }

  if(state.drawer.kind==="partner"){
    const p = partners.find(x=>x.id===state.drawer.id);
    if(!p) return "";
    const jobs = rawBookings.filter(b=>b.provider===p.name).sort((a,b)=>b.at-a.at).slice(0,6);
    return `
    <div class="fixed inset-0 z-30 flex justify-end" data-drawer-overlay>
      <div class="absolute inset-0" style="background:rgba(0,0,0,.5)" data-close-drawer></div>
      <div class="relative w-[380px] h-full p-6 flex flex-col gap-5 overflow-y-auto" style="background:var(--surface);border-left:1px solid var(--border-soft)">
        <div class="flex items-center justify-between">
          <p class="disp font-semibold" style="font-size:16px">โปรไฟล์ผู้ให้บริการ</p>
          ${closeBtn}
        </div>
        <div class="card p-4 flex items-center gap-3">
          <div class="w-11 h-11 rounded-full flex items-center justify-center disp font-semibold" style="background:var(--surface-hover)">${p.name.slice(0,1)}</div>
          <div><p class="disp font-semibold" style="font-size:14px">${p.name}</p><p style="font-size:11.5px;color:var(--ink-faint)">${p.role}</p></div>
        </div>
        <div class="flex gap-2">
          ${["avail","busy","off"].map(s=>`
            <button data-set-partner-status="${s}" class="flex-1 py-2 rounded-lg text-center" style="font-size:11.5px;border:1px solid ${state.drawer.id===p.id&&p.status===s?tone({avail:"brand",busy:"blue",off:"red"}[s]):"var(--border)"};background:${p.status===s?toneDim({avail:"brand",busy:"blue",off:"red"}[s]):"transparent"};color:${p.status===s?tone({avail:"brand",busy:"blue",off:"red"}[s]):"var(--ink-dim)"}">
              ${s==="avail"?"พร้อมงาน":s==="busy"?"กำลังให้บริการ":"ไม่พร้อม"}
            </button>`).join("")}
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="card p-3 text-center"><p class="disp font-semibold" style="font-size:18px">${p.rating}</p><p style="font-size:11px;color:var(--ink-faint)">คะแนนเฉลี่ย</p></div>
          <div class="card p-3 text-center"><p class="disp font-semibold" style="font-size:18px">${p.jobsToday}</p><p style="font-size:11px;color:var(--ink-faint)">งานวันนี้</p></div>
        </div>
        <div>
          <p style="font-size:12px;color:var(--ink-faint)" class="mb-2">ประวัติงานล่าสุด</p>
          <div class="flex flex-col gap-2">
            ${jobs.length ? jobs.map(j=>`
              <div class="flex items-center justify-between p-2.5 rounded-lg" style="background:var(--surface)">
                <span style="font-size:12.5px">${userById(j.userId).name}</span>
                <span style="font-size:11px;color:var(--ink-faint)">${fmtDate(j.at)}</span>
              </div>`).join("") : `<p style="font-size:12px;color:var(--ink-faint)">ไม่มีประวัติ</p>`}
          </div>
        </div>
      </div>
    </div>`;
  }
  return "";
}

/* ============================= ROOT RENDER ============================= */
function sectionBody(){
  if(state.section==="overview") return overviewSection();
  if(state.section==="bookings") return bookingsSection();
  if(state.section==="partners") return partnersSection();
  if(state.section==="customers") return customersSection();
  return "";
}

function render(){
  const app = document.getElementById("app");
  if(!state.auth.loggedIn){
    app.innerHTML = loginScreen();
    if(window.lucide) lucide.createIcons();
    bindLoginEvents();
    return;
  }
  app.innerHTML = `
  <div class="flex">
    ${sidebar()}
    <main class="flex-1 min-w-0">
      ${topbar()}
      <div class="p-7">${sectionBody()}</div>
    </main>
  </div>
  ${drawer()}`;
  if(window.lucide) lucide.createIcons();
  bindEvents();
}

function bindLoginEvents(){
  const form = document.getElementById("loginForm");
  if(form){
    form.addEventListener("submit", e=>{ e.preventDefault(); handleLogin(); });
  }
}

async function handleLogin(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  if(!email || !password){ state.auth.error = "กรุณากรอกอีเมลและรหัสผ่าน"; render(); return; }
  state.auth.loading = true; state.auth.error = ""; render();
  const result = await authenticate(email, password);
  // เมื่อสำเร็จ ไม่ต้องเซ็ต state เอง — onAuthStateChanged ด้านล่างจะรับช่วงต่อและ render ให้
  if(!result.ok){
    state.auth.loading = false; state.auth.error = result.error;
    render();
  }
}

function handleLogout(){
  firebase.auth().signOut();
  // onAuthStateChanged ด้านล่างจะรับช่วง set state.auth.loggedIn = false และ render ให้เอง
}

function bindEvents(){
  document.querySelectorAll("[data-logout]").forEach(el=>el.addEventListener("click", handleLogout));
  document.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click",()=>setState({section:el.dataset.nav, drawer:null})));

  const bs = document.getElementById("bookingSearchInput");
  if(bs){ bs.addEventListener("input", e=>{ state.bookingSearch = e.target.value; renderKeepFocus(bs); }); }
  const bc = document.getElementById("bookingCatSelect");
  if(bc){ bc.addEventListener("change", e=>setState({bookingCat:e.target.value})); }
  const bst = document.getElementById("bookingStatusSelect");
  if(bst){ bst.addEventListener("change", e=>setState({bookingStatus:e.target.value})); }

  const us = document.getElementById("userSearchInput");
  if(us){ us.addEventListener("input", e=>{ state.userSearch = e.target.value; renderKeepFocus(us); }); }
  const uf = document.getElementById("userFilterSelect");
  if(uf){ uf.addEventListener("change", e=>setState({userFilter:e.target.value})); }

  document.querySelectorAll("[data-open-booking]").forEach(el=>el.addEventListener("click",()=>setState({drawer:{kind:"booking",ref:el.dataset.openBooking}})));
  document.querySelectorAll("[data-open-partner]").forEach(el=>el.addEventListener("click",()=>setState({drawer:{kind:"partner",id:el.dataset.openPartner}})));
  document.querySelectorAll("[data-close-drawer]").forEach(el=>el.addEventListener("click",()=>setState({drawer:null})));
  document.querySelectorAll("[data-set-partner-status]").forEach(el=>el.addEventListener("click",()=>{
    const p = partners.find(x=>x.id===state.drawer.id);
    if(p){ p.status = el.dataset.setPartnerStatus; render(); }
  }));
}

/* keep caret position/focus while re-rendering on every keystroke in search inputs */
function renderKeepFocus(inputEl){
  const id = inputEl.id, pos = inputEl.selectionStart;
  render();
  const el = document.getElementById(id);
  if(el){ el.focus(); el.setSelectionRange(pos,pos); }
}

firebase.auth().onAuthStateChanged(user=>{
  if(user){
    state.auth = { loggedIn:true, user:{ name:user.displayName || user.email, email:user.email }, loading:false, error:"" };
  } else {
    state.auth = { loggedIn:false, user:null, loading:false, error:"" };
    state.section = "overview"; state.drawer = null;
  }
  render();
});
</script>
</body>
</html>
